<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offaways — Filings</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container inner">
      <span class="brand"><img src="/img/logo.svg" height="22" alt="" />Offaways</span>
      <div class="navbar-actions">
        <a href="/index.html">Filings</a>
        <a href="/admin.html" id="nav-settings">Settings</a>
        <a href="#" id="nav-logout">Logout</a>
      </div>
    </div>
  </nav>

  <!-- Toast -->
  <div style="position:fixed;top:1rem;right:1rem;z-index:999;max-width:340px;">
    <div id="toast" class="alert hidden"></div>
  </div>

  <!-- Page -->
  <div class="container page">
    <div class="card">
      <div class="card-header">
        <h2>Filings</h2>
        <button class="btn btn-primary btn-sm" id="btn-new">+ New Filing</button>
      </div>

      <!-- Loading -->
      <div id="loading-state" class="empty-state hidden">
        <span class="spinner" style="width:2rem;height:2rem;border-width:3px;"></span>
      </div>

      <!-- Empty -->
      <div id="empty-state" class="empty-state hidden">
        <strong>No filings yet</strong>
        <p>Click "New Filing" to get started.</p>
      </div>

      <!-- Table -->
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Form ID</th>
              <th>Type</th>
              <th>Status</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="filings-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal-backdrop hidden" id="delete-modal">
    <div class="modal" style="max-width:400px;" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h2>Delete Filing</h2>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to permanently delete this filing? This action cannot be undone.</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="btn-delete-cancel">Cancel</button>
        <button class="btn btn-danger"    id="btn-delete-confirm">Delete</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js/dist/amazon-cognito-identity.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
