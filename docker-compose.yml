version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: offaways-db
    environment:
      POSTGRES_DB: offaways
      POSTGRES_USER: offaways
      POSTGRES_PASSWORD: offaways_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U offaways']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    container_name: offaways-api
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: local
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: offaways
      DB_USER: offaways
      DB_PASSWORD: offaways_dev
      JWT_SECRET: local_dev_secret_change_in_prod_must_be_long
      CORS_ORIGIN: http://localhost:8080
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    command: npm run dev

  frontend:
    image: nginx:alpine
    container_name: offaways-frontend
    ports:
      - '8080:80'
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:
